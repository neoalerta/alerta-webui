name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '14'
    - run: npm install
    - run: npm run format-check
    - run: npm run lint:nofix
    - run: npm run test:unit
    - run: npm run build
