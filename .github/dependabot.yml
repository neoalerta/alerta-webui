version: 2
updates:
  # Dependências do npm: uma rodada por mês, tudo agrupado. Majors ficam de
  # fora: a base está congelada em Vue 2 / Vuetify 1.5 / webpack 4 / Node 14,
  # e um major aqui é migração, não atualização.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      atualizacoes:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      seguranca:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Actions usadas nos workflows: um PR por mês com todas.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
